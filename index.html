<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ҚМДБ цифрлық ақпараттық терминалы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./kiosk/kiosk.css">
</head>
<body>
<div id="stage">
  <div id="screen">
    <header class="k-header" id="kHeader"></header>
    <div class="k-body">
      <main class="k-main" id="kMain"></main>
      <aside class="k-side" id="kSide"></aside>
    </div>
    <div class="k-embed" id="kEmbed" aria-hidden="true">
      <div class="k-embed-card" role="dialog" aria-modal="true">
        <div class="k-embed-head">
          <span class="k-embed-title" id="kEmbedTitle"></span>
          <button class="k-embed-close" id="kEmbedClose" aria-label="Жабу">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="k-embed-body">
          <div class="k-embed-load" id="kEmbedLoad"><i></i></div>
          <iframe id="kEmbedFrame" title="" src="about:blank" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </div>
    <div class="k-toast" id="kToast" role="status"></div>
  </div>
</div>
<script src="./kiosk/data.js"></script>
<script src="./kiosk/components.js"></script>
<script src="./kiosk/app.js"></script>
</body>
</html>
