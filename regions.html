<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script>try{if(localStorage.getItem('kiosk-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<title>ҚМДБ өкілдіктері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1d17; --muted:#66756e; --line:rgba(15,29,23,.08);
    --green:#0e4b36; --green-d:#083425; --green-l:#2f7a5c;
    --mint:#eef5f1; --gold:#b08d43; --surface:#fff;
    --fh:"Oswald",system-ui,sans-serif; --fb:"IBM Plex Sans",system-ui,sans-serif;
    --card:0 14px 40px rgba(9,42,30,.07), 0 2px 6px rgba(9,42,30,.04);
    --card-h:0 22px 60px rgba(9,42,30,.13), 0 3px 8px rgba(9,42,30,.06);
    --e:cubic-bezier(.22,.8,.28,1);
  }
  html[data-theme=dark]{
    --ink:#e8f0eb; --muted:#98aba0; --line:rgba(255,255,255,.09);
    --surface:#0f1a15; --mint:#132420;
    --card:0 14px 40px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --card-h:0 22px 60px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:pan-x pan-y;background:#dfe5e2}
  html[data-theme=dark] body{background:#060b09}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  #stage{position:fixed;inset:0}
  #screen{
    position:absolute;top:50%;left:50%;transform-origin:center center;
    width:1920px;height:1080px;padding:40px 60px 30px;display:flex;flex-direction:column;
    font-family:var(--fb);color:var(--ink);border-radius:4px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 88% -12%, rgba(14,75,54,.10), transparent 62%),
      radial-gradient(900px 520px at -6% 108%, rgba(14,75,54,.07), transparent 60%),
      #fbfcfb;
    box-shadow:0 30px 90px rgba(9,42,30,.2);
    transition:background .3s var(--e)
  }
  html[data-theme=dark] #screen{background:radial-gradient(1200px 600px at 88% -12%,rgba(47,143,105,.16),transparent 62%),radial-gradient(900px 520px at -6% 108%,rgba(47,143,105,.09),transparent 60%),#060b09}
  #screen>*{position:relative}
  h1,h2,h3{font-family:var(--fh);margin:0;font-weight:400}

  @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .anim{animation:up .6s var(--e) backwards}

  /* ── Header ── */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:40px;
    padding-bottom:18px;border-bottom:1px solid var(--line);flex:none}
  .headleft{display:flex;align-items:center;gap:20px;min-width:0}
  .crest{width:60px;height:60px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--mint)}
  .crest img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
  .kicker{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--green-l);font-weight:500;
    margin-bottom:5px;display:flex;align-items:center;gap:8px}
  .kicker::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);flex:none}
  h1.pagetitle{font-size:32px;letter-spacing:.02em}
  .navbtns{display:flex;align-items:center;gap:12px;flex:none}
  .nbtn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;
    font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;
    transition:transform .25s var(--e),box-shadow .25s var(--e);white-space:nowrap}
  .nbtn:active{transform:scale(.96)}
  .nbtn svg{width:17px;height:17px;flex:none}
  .nbtn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--card);border:1px solid var(--line)}
  .nbtn.solid{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;box-shadow:0 14px 30px rgba(14,75,54,.3)}

  /* ── Статистика ── */
  .stats{display:flex;gap:14px;padding:10px 0 4px}
  .stat{display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:16px;
    background:var(--surface);box-shadow:var(--card);border:1px solid var(--line)}
  .stat-ic{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;
    background:var(--mint);color:var(--green-l)}
  html[data-theme=dark] .stat-ic{color:var(--green-l)}
  .stat-ic svg{width:19px;height:19px}
  .stat b{font-family:var(--fh);font-weight:500;font-size:22px;line-height:1;display:block}
  .stat span{font-size:12px;color:var(--muted);letter-spacing:.02em}

  /* ── Scroll аймағы ── */
  .scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 4px 30px 0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(14,75,54,.22);border-radius:99px}
  html[data-theme=dark] .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}

  .section-lab{display:flex;align-items:center;gap:10px;margin:26px 0 16px;font-size:13px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .section-lab:first-child{margin-top:2px}
  .section-lab::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ── Өкілдік карточкалары ── */
  .dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .dept-card{position:relative;overflow:hidden;text-align:center;border-radius:22px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--card);
    padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;
    transition:transform .22s var(--e),box-shadow .22s var(--e)}
  .dept-card:active{transform:scale(.97)}
  .d-photo{width:78px;height:78px;border-radius:50%;flex:none;position:relative;margin-bottom:14px;
    background:var(--mint);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
  .d-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .d-photo svg{width:36px;height:36px;color:var(--muted);opacity:.55}
  .d-tx{min-width:0}
  .d-title{font-size:15px;font-weight:600;line-height:1.28;margin-bottom:6px}
  .d-role{font-size:11.5px;color:var(--green-l);letter-spacing:.02em;line-height:1.3;margin-bottom:5px}
  html[data-theme=dark] .d-role{color:var(--green-l)}
  .d-head{font-size:12.5px;color:var(--ink);line-height:1.3}
  .d-head.ph{color:var(--muted);font-style:italic;font-weight:400}
</style>
</head>
<body>
<div id="stage"><div id="screen">

  <header class="top anim" style="animation-delay:.05s">
    <div class="headleft">
      <div class="crest"><img src="./assets/logo-qmdb.png" alt="ҚМДБ"></div>
      <div style="min-width:0">
        <div class="kicker">Қазақстан мұсылмандары діни басқармасы</div>
        <h1 class="pagetitle">ӨКІЛДІКТЕР</h1>
      </div>
    </div>
    <div class="navbtns">
      <a class="nbtn ghost" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Артқа
      </a>
      <a class="nbtn solid" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>
        Басты бет
      </a>
    </div>
  </header>

  <div class="scroll anim" style="animation-delay:.1s">
    <div class="stats">
      <div class="stat">
        <div class="stat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21c-4-4.6-7-8-7-11a7 7 0 0 1 14 0c0 3-3 6.4-7 11Z"/></svg></div>
        <div><b>20</b><span>өкілдік</span></div>
      </div>
    </div>

    <div class="section-lab">Облыстық өкілдіктер</div>
    <div class="dept-grid" id="regionGrid"></div>

  </div>

</div></div>

<script>
/* ══ Деректер: кейін нақты аты-жөн / фото осында толтырылады ══ */
const REGIONS = [
  {region:'Астана қаласы', head:null, photo:null},
  {region:'Алматы қаласы', head:null, photo:null},
  {region:'Шымкент қаласы', head:null, photo:null},
  {region:'Абай облысы', head:null, photo:null},
  {region:'Ақмола облысы', head:null, photo:null},
  {region:'Ақтөбе облысы', head:null, photo:null},
  {region:'Алматы облысы', head:null, photo:null},
  {region:'Атырау облысы', head:null, photo:null},
  {region:'Батыс Қазақстан облысы', head:null, photo:null},
  {region:'Жамбыл облысы', head:null, photo:null},
  {region:'Жетісу облысы', head:null, photo:null},
  {region:'Қарағанды облысы', head:null, photo:null},
  {region:'Қостанай облысы', head:null, photo:null},
  {region:'Қызылорда облысы', head:null, photo:null},
  {region:'Маңғыстау облысы', head:null, photo:null},
  {region:'Павлодар облысы', head:null, photo:null},
  {region:'Солтүстік Қазақстан облысы', head:null, photo:null},
  {region:'Түркістан облысы', head:null, photo:null},
  {region:'Ұлытау облысы', head:null, photo:null},
  {region:'Шығыс Қазақстан облысы', head:null, photo:null}
];

const personIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 21c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>`;

function regionCard(r){
  const photo = r.photo ? `<img src="${r.photo}" alt="">` : personIcon;
  const role = `${r.region}ның Бас имамы`;
  const head = r.head
    ? `<div class="d-head">${r.head}</div>`
    : `<div class="d-head ph">Аты-жөні жарияланады</div>`;
  return `
    <div class="dept-card">
      <div class="d-photo">${photo}</div>
      <div class="d-tx">
        <div class="d-title">${r.region}</div>
        <div class="d-role">${role}</div>
        ${head}
      </div>
    </div>`;
}

document.getElementById('regionGrid').innerHTML = REGIONS.map(regionCard).join('');

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById('screen').style.transform = 'translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize', fit); fit();
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].includes(e.key))e.preventDefault()});
addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));
</script>
</body>
</html>
