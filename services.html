<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script>try{if(localStorage.getItem('kiosk-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<title>Қызметтер — ҚМДБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1d17; --muted:#66756e; --line:rgba(15,29,23,.08);
    --green:#0e4b36; --green-d:#083425; --green-l:#2f7a5c;
    --mint:#eef5f1; --gold:#b08d43; --surface:#fff;
    --fh:"Oswald",system-ui,sans-serif; --fb:"IBM Plex Sans",system-ui,sans-serif;
    --card:0 14px 40px rgba(9,42,30,.07), 0 2px 6px rgba(9,42,30,.04);
    --card-h:0 22px 60px rgba(9,42,30,.13), 0 3px 8px rgba(9,42,30,.06);
    --e:cubic-bezier(.22,.8,.28,1);
  }
  html[data-theme=dark]{
    --ink:#e8f0eb; --muted:#98aba0; --line:rgba(255,255,255,.09);
    --surface:#0f1a15; --mint:#132420;
    --card:0 14px 40px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --card-h:0 22px 60px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:pan-x pan-y;background:#dfe5e2}
  html[data-theme=dark] body{background:#060b09}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  #stage{position:fixed;inset:0}
  #screen{
    position:absolute;top:50%;left:50%;transform-origin:center center;
    width:1920px;height:1080px;padding:36px 60px 30px;display:flex;flex-direction:column;
    font-family:var(--fb);color:var(--ink);border-radius:4px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 88% -12%, rgba(14,75,54,.10), transparent 62%),
      radial-gradient(900px 520px at -6% 108%, rgba(14,75,54,.07), transparent 60%),
      #fbfcfb;
    box-shadow:0 30px 90px rgba(9,42,30,.2);
    transition:background .3s var(--e)
  }
  html[data-theme=dark] #screen{background:radial-gradient(1200px 600px at 88% -12%,rgba(47,143,105,.16),transparent 62%),radial-gradient(900px 520px at -6% 108%,rgba(47,143,105,.09),transparent 60%),#060b09}
  #screen>*{position:relative}
  h1,h2,h3{font-family:var(--fh);margin:0;font-weight:400}

  @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .anim{animation:up .55s var(--e) backwards}

  /* ── Header ── */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:32px;
    padding-bottom:16px;border-bottom:1px solid var(--line);flex:none}
  .headleft{display:flex;align-items:center;gap:18px;min-width:0}
  .crest{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--mint)}
  .crest img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
  .kicker{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--green-l);font-weight:500;
    margin-bottom:5px;display:flex;align-items:center;gap:8px}
  .kicker::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);flex:none}
  h1.pagetitle{font-size:28px;letter-spacing:.02em}
  .pagetitle small{display:block;font-family:var(--fb);font-size:14.5px;color:var(--muted);letter-spacing:0;margin-top:4px;font-weight:400}
  .navbtns{display:flex;align-items:center;gap:12px;flex:none}
  .nbtn{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:999px;
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;
    transition:transform .25s var(--e),box-shadow .25s var(--e);white-space:nowrap}
  .nbtn:active{transform:scale(.96)}
  .nbtn svg{width:16px;height:16px;flex:none}
  .nbtn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--card);border:1px solid var(--line)}
  .nbtn.solid{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;box-shadow:0 14px 30px rgba(14,75,54,.3)}

  /* ── Іздеу + категория фильтрі (бір қатарда) ── */
  .searchwrap{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 2px}
  .search{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;border-radius:16px;
    background:var(--surface);box-shadow:var(--card);border:1px solid var(--line);width:380px;flex:none;margin-left:auto}
  .search svg{width:18px;height:18px;color:var(--muted);flex:none}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--fb);font-size:15.5px;color:var(--ink)}
  .search input::placeholder{color:var(--muted)}
  .rescount{margin-top:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  .cat-tabs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
  .cat-tab{display:flex;align-items:center;height:46px;padding:0 20px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--card);color:var(--muted);
    font-size:13.5px;font-weight:500;transition:background .25s var(--e),color .25s var(--e),box-shadow .25s var(--e)}
  .cat-tab.on{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;
    box-shadow:0 14px 30px rgba(14,75,54,.28)}

  /* ── Scroll аймағы ── */
  .scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 4px 30px 0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(14,75,54,.22);border-radius:99px}
  html[data-theme=dark] .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}

  .section-lab{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font-size:12.5px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .section-lab:first-child{margin-top:2px}
  .section-lab::after{content:"";flex:1;height:1px;background:var(--line)}
  .section-lab.hide{display:none}

  /* ── Қызмет карточкалары ── */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .svc-card{position:relative;overflow:hidden;text-align:left;border-radius:20px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--card);
    padding:20px 56px 20px 20px;display:flex;align-items:center;gap:16px;min-height:104px;
    transition:transform .2s var(--e),box-shadow .2s var(--e)}
  .svc-card:active{transform:scale(.97)}
  .svc-card.hide{display:none}
  .svc-ic{width:52px;height:52px;flex:none;border-radius:15px;background:var(--mint);color:var(--green-l);
    display:grid;place-items:center}
  html[data-theme=dark] .svc-ic{color:var(--green-l)}
  .svc-ic svg{width:26px;height:26px}
  .svc-body{min-width:0}
  .svc-title{font-size:15.5px;font-weight:600;line-height:1.28;margin-bottom:4px}
  .svc-desc{font-size:12.5px;color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .svc-go{position:absolute;right:16px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;background:var(--mint);color:var(--green)}
  html[data-theme=dark] .svc-go{color:var(--green-l)}
  .svc-go svg{width:16px;height:16px}

  .noresult{display:none;padding:40px 0;text-align:center;color:var(--muted);font-size:15px}

  /* ── Detail Modal ── */
  #screen>.svc-overlay{position:absolute}
  .svc-overlay{inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
    background:rgba(3,10,7,.6);opacity:0;pointer-events:none;transition:opacity .3s var(--e)}
  .svc-overlay.show{opacity:1;pointer-events:auto}
  .svc-modal{width:800px;max-width:92%;max-height:87%;display:flex;flex-direction:column;
    background:var(--surface);border-radius:28px;box-shadow:var(--card-h);
    transform:translateY(18px) scale(.97);opacity:0;transition:transform .35s var(--e),opacity .35s var(--e);overflow:hidden}
  .svc-overlay.show .svc-modal{transform:none;opacity:1}
  .svc-hero{flex:none;position:relative;padding:30px 70px 26px 30px;color:#fff;
    background:linear-gradient(150deg,#0b3d2c,#0e4b36 60%,#146447)}
  .svc-close{position:absolute;top:20px;right:20px;width:42px;height:42px;border-radius:14px;
    background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
  .svc-close svg{width:18px;height:18px}
  .svc-hero-ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.14);color:#e8cf8f;
    display:grid;place-items:center;margin-bottom:14px}
  .svc-hero-ic svg{width:30px;height:30px}
  .svc-hero h2{font-size:25px;line-height:1.25}
  .svc-hero .dept{margin-top:7px;font-size:13.5px;color:rgba(255,255,255,.75)}

  .svc-body-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 30px 30px}
  .svc-body-scroll::-webkit-scrollbar{width:7px}
  .svc-body-scroll::-webkit-scrollbar-thumb{background:rgba(14,75,54,.2);border-radius:99px}

  .svc-desc-full{font-size:15px;line-height:1.65;color:var(--ink);margin-bottom:24px}

  .svc-sec-lab{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin-bottom:12px}
  .svc-rows{margin-bottom:24px}
  .svc-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .svc-row:first-child{border-top:0}
  .svc-row-ic{width:38px;height:38px;flex:none;border-radius:12px;background:var(--mint);color:var(--green-l);
    display:grid;place-items:center}
  html[data-theme=dark] .svc-row-ic{color:var(--green-l)}
  .svc-row-ic svg{width:18px;height:18px}
  .svc-row-lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .svc-row-val{font-size:14.5px;font-weight:500}
  .svc-row-val.ph{color:var(--muted);font-style:italic;font-weight:400}

  .svc-actions{display:flex;flex-wrap:wrap;gap:11px}
  .svc-btn{flex:1;min-width:180px;display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;
    font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;font-weight:500}
  .svc-btn svg{width:17px;height:17px}
  .svc-btn.primary{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;box-shadow:0 14px 30px rgba(14,75,54,.28)}
  .svc-btn.ghost{background:var(--mint);color:var(--ink)}
</style>
</head>
<body>
<div id="stage"><div id="screen">

  <header class="top anim" style="animation-delay:.05s">
    <div class="headleft">
      <div class="crest"><img src="./assets/logo-qmdb.png" alt="ҚМДБ"></div>
      <div style="min-width:0">
        <div class="kicker">Қазақстан мұсылмандары діни басқармасы</div>
        <h1 class="pagetitle">ҚЫЗМЕТТЕР<small>Қажетті қызметті таңдаңыз</small></h1>
      </div>
    </div>
    <div class="navbtns">
      <a class="nbtn ghost" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Артқа
      </a>
      <a class="nbtn solid" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>
        Басты бет
      </a>
    </div>
  </header>

  <div class="searchwrap anim" style="animation-delay:.08s">
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab on" data-cat="all">Барлығы</button>
      <button class="cat-tab" data-cat="top">Топ қызметтер</button>
      <button class="cat-tab" data-cat="paid">Ақылы қызметтер</button>
      <button class="cat-tab" data-cat="digital">Цифрлық ресурстар</button>
      <button class="cat-tab" data-cat="charity">Қайырымдылық</button>
      <button class="cat-tab" data-cat="other">Басқа</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Қандай қызмет іздеп тұрсыз?">
    </label>
  </div>
  <div class="rescount" id="resCount"></div>

  <div class="scroll anim" style="animation-delay:.12s" id="svcScroll"></div>

  <div class="svc-overlay" id="svcOverlay">
    <div class="svc-modal" role="dialog" aria-modal="true">
      <div class="svc-hero">
        <button class="svc-close" id="svcClose" aria-label="Жабу">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="svc-hero-ic" id="mIcon"></div>
        <h2 id="mTitle"></h2>
        <div class="dept" id="mDept"></div>
      </div>
      <div class="svc-body-scroll">
        <div class="svc-desc-full" id="mDesc"></div>
        <div class="svc-sec-lab">Байланыс</div>
        <div class="svc-rows" id="mRows"></div>
        <div class="svc-actions" id="mActions"></div>
      </div>
    </div>
  </div>

</div></div>

<script>
/* ══ Деректер: барлық қызметтер бір массивте ══ */
const SERVICES = [
  {id:'hotline', category:'top', title:'Діни ақпарат беру орталығы 24/7', shortDescription:'1511 Call Center арқылы діни сұрақтарға жауап алу',
   description:'Діни ақпарат беру орталығы тәулік бойы 1511 нөмірі арқылы дін мәселелері бойынша сұрақтарға жауап береді.',
   icon:'phone', department:'Ақпарат және қоғаммен байланыс бөлімі', phone:'1511', email:null, workingHours:'24/7',

  {id:'written', category:'top', title:'Жазбаша діни сұрақ қою', shortDescription:'Діни сұрақты онлайн жолдау / Telegram-бот',
   description:'Дін мәселелері бойынша сұрағыңызды онлайн нысан немесе Telegram-бот арқылы жазбаша жолдап, маман жауабын алуға болады.',
   icon:'chat', department:'Шариғат және пәтуа бөлімі', website:null, email:null,

  {id:'family', category:'top', title:'Отбасы мәселесі бойынша кеңес', shortDescription:'Шариғат және пәтуа бөлімі мамандарының қабылдауы',
   description:'Неке, ажырасу және отбасылық қатынастарға қатысты шариғат тұрғысынан кеңес алу үшін мамандар қабылдауына жазылуға болады.',
   icon:'family', department:'Шариғат және пәтуа бөлімі', office:null, floor:null, phone:null, workingHours:null, address:null,

   description:'ҚМДБ басшылығы немесе тиісті бөлім маманының қабылдауына алдын ала жазылу қызметі.',

  {id:'halal', category:'paid', title:'Халал сертификат алу', shortDescription:'«Халал Даму» сертификаттау орталығы',

   icon:'badge', department:'«Халал Даму» мекемесі', phone:null, email:null, website:null, workingHours:null, address:null,
   actionType:['call','website']},

  {id:'hajj', category:'other', title:'Қажылық және ұмра', shortDescription:'Қажылық пен ұмраға қатысты ақпарат және кеңес',
   description:'Қажылық және ұмра сапарына дайындық, тіркеу мерзімдері мен шарттары бойынша ақпарат және кеңес беру қызметі.',
   icon:'kaaba', department:'Қажылық бөлімі', phone:null, office:null, workingHours:null, address:null,

  {id:'expertise', category:'top', title:'Діни сараптама алу', shortDescription:'Діни материалдар мен әдебиеттерге қатысты сараптама',

  {id:'mosque-reg', category:'other', title:'Мешіттерді тіркеу', shortDescription:'Мешіт қызметіне қатысты мәселелер',

   actionType:['call','website']},

const iconSvg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.globe}</svg>`;
const arrowSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

const CATEGORIES = [
  {key:'top',     label:'Топ қызметтер'},
  {key:'paid',    label:'Ақылы қызметтер'},
  {key:'digital', label:'Цифрлық ресурстар'},
  {key:'charity', label:'Қайырымдылық'},
  {key:'other',   label:'Басқа'}
];

function svcCard(s){
  const i = SERVICES.indexOf(s);
  return `
    <button class="svc-card" data-i="${i}" data-cat="${s.category}" data-q="${(s.title + ' ' + s.shortDescription).toLowerCase()}">
      <div class="svc-ic">${iconSvg(s.icon)}</div>
      <div class="svc-body">
        <div class="svc-title">${s.title}</div>
        <div class="svc-desc">${s.shortDescription}</div>
      </div>
      <span class="svc-go">${arrowSvg}</span>
    </button>`;
}

const scrollEl = document.getElementById('svcScroll');
scrollEl.innerHTML = CATEGORIES.map(c => {
  const items = SERVICES.filter(s => s.category === c.key);
  return `
    <div class="section-lab" data-cat="${c.key}">${c.label}</div>
    <div class="svc-grid" data-cat-grid="${c.key}">${items.map(svcCard).join('')}</div>`;
}).join('') + '<div class="noresult" id="noResult">Ештеңе табылмады</div>';

const grid = scrollEl;
const resCount = document.getElementById('resCount');
const noResult = document.getElementById('noResult');
let activeCat = 'all';

function applyFilter(){
  const v = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.svc-card').forEach(el => {
    const matchQ = !v || el.dataset.q.includes(v);
    const matchCat = activeCat === 'all' || el.dataset.cat === activeCat;
    const match = matchQ && matchCat;
    el.classList.toggle('hide', !match);
    if (match) shown++;
  });
  document.querySelectorAll('[data-cat-grid]').forEach(g => {
    const any = [...g.children].some(c => !c.classList.contains('hide'));
    g.previousElementSibling.classList.toggle('hide', !any);
    g.classList.toggle('hide', !any);
  });
  noResult.style.display = shown === 0 ? 'block' : 'none';
  resCount.textContent = v ? `${shown} нәтиже табылды` : '';
}

document.getElementById('q').addEventListener('input', applyFilter);

document.getElementById('catTabs').addEventListener('click', e => {
  const t = e.target.closest('.cat-tab'); if (!t) return;
  activeCat = t.dataset.cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('on', b === t));
  applyFilter();
});

/* ── Detail Modal ── */
const overlay = document.getElementById('svcOverlay');

const ROW_DEFS = [
  {key:'office',       lab:'Кабинет',        icon:'building2'},
  {key:'floor',        lab:'Қабат',          icon:'building2'},
  {key:'phone',        lab:'Телефон',        icon:'phone'},
  {key:'email',        lab:'E-mail',         icon:'chat'},
  {key:'workingHours', lab:'Жұмыс уақыты',   icon:'calendar'},
  {key:'website',      lab:'Ресми сайт',     icon:'globe'},
  {key:'address',      lab:'Мекенжай',       icon:'kaaba'}
];

function openService(s){
  document.getElementById('mIcon').innerHTML = iconSvg(s.icon);
  document.getElementById('mTitle').textContent = s.title;
  const dept = document.getElementById('mDept');
  if (s.department){ dept.textContent = s.department; dept.style.display = ''; }
  else { dept.style.display = 'none'; }
  document.getElementById('mDesc').textContent = s.description;

  const rows = ROW_DEFS.filter(r => Object.prototype.hasOwnProperty.call(s, r.key));
  document.getElementById('mRows').innerHTML = rows.map(r => {
    const val = s[r.key];
    return `
      <div class="svc-row">
        <div class="svc-row-ic">${iconSvg(r.icon)}</div>
        <div>
          <div class="svc-row-lab">${r.lab}</div>
          <div class="svc-row-val${val ? '' : ' ph'}">${val || 'Жарияланады'}</div>
        </div>
      </div>`;
  }).join('');

  const actions = [];
  const at = s.actionType || [];
  if (at.includes('call')) actions.push(`<span class="svc-btn primary">${iconSvg('phone')}Қоңырау шалу</span>`);
  if (at.includes('website')) actions.push(`<span class="svc-btn primary">${iconSvg('globe')}Сайтқа өту</span>`);
  if (at.includes('qr')) actions.push(`<span class="svc-btn ghost">QR арқылы ашу</span>`);
  if (at.includes('appointment')) actions.push(`<span class="svc-btn ghost">${iconSvg('calendar')}Қабылдауға жазылу</span>`);
  if (at.includes('location')) actions.push(`<span class="svc-btn ghost">${iconSvg('kaaba')}Орналасқан жерін көрсету</span>`);
  document.getElementById('mActions').innerHTML = actions.join('');

  overlay.classList.add('show');
}
function closeService(){ overlay.classList.remove('show'); }

grid.addEventListener('click', e => {
  const card = e.target.closest('.svc-card');
  if (card) openService(SERVICES[+card.dataset.i]);
});
document.getElementById('svcClose').addEventListener('click', closeService);
overlay.addEventListener('click', e => { if (e.target === overlay) closeService(); });

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById('screen').style.transform = 'translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize', fit); fit();
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].includes(e.key))e.preventDefault()});
addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));
</script>
