<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script>try{if(localStorage.getItem('kiosk-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<title>ҚМДБ-ға қарасты мекемелер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1d17; --muted:#66756e; --line:rgba(15,29,23,.08);
    --green:#0e4b36; --green-d:#083425; --green-l:#2f7a5c;
    --mint:#eef5f1; --gold:#b08d43; --surface:#fff;
    --fh:"Oswald",system-ui,sans-serif; --fb:"IBM Plex Sans",system-ui,sans-serif;
    --card:0 14px 40px rgba(9,42,30,.07), 0 2px 6px rgba(9,42,30,.04);
    --card-h:0 22px 60px rgba(9,42,30,.13), 0 3px 8px rgba(9,42,30,.06);
    --e:cubic-bezier(.22,.8,.28,1);
  }
  html[data-theme=dark]{
    --ink:#e8f0eb; --muted:#98aba0; --line:rgba(255,255,255,.09);
    --surface:#0f1a15; --mint:#132420;
    --card:0 14px 40px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --card-h:0 22px 60px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:pan-x pan-y;background:#dfe5e2}
  html[data-theme=dark] body{background:#060b09}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  #stage{position:fixed;inset:0}
  #screen{
    position:absolute;top:50%;left:50%;transform-origin:center center;
    width:1920px;height:1080px;padding:40px 60px 30px;display:flex;flex-direction:column;
    font-family:var(--fb);color:var(--ink);border-radius:4px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 88% -12%, rgba(14,75,54,.10), transparent 62%),
      radial-gradient(900px 520px at -6% 108%, rgba(14,75,54,.07), transparent 60%),
      #fbfcfb;
    box-shadow:0 30px 90px rgba(9,42,30,.2);
    transition:background .3s var(--e)
  }
  html[data-theme=dark] #screen{background:radial-gradient(1200px 600px at 88% -12%,rgba(47,143,105,.16),transparent 62%),radial-gradient(900px 520px at -6% 108%,rgba(47,143,105,.09),transparent 60%),#060b09}
  #screen>*{position:relative}
  h1,h2,h3{font-family:var(--fh);margin:0;font-weight:400}

  @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .anim{animation:up .6s var(--e) backwards}

  /* ── Header ── */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:40px;
    padding-bottom:18px;border-bottom:1px solid var(--line);flex:none}
  .headleft{display:flex;align-items:center;gap:20px;min-width:0}
  .crest{width:60px;height:60px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--mint)}
  .crest img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
  .kicker{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--green-l);font-weight:500;
    margin-bottom:5px;display:flex;align-items:center;gap:8px}
  .kicker::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);flex:none}
  h1.pagetitle{font-size:30px;letter-spacing:.02em}
  .navbtns{display:flex;align-items:center;gap:12px;flex:none}
  .nbtn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;
    font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;
    transition:transform .25s var(--e),box-shadow .25s var(--e);white-space:nowrap}
  .nbtn:active{transform:scale(.96)}
  .nbtn svg{width:17px;height:17px;flex:none}
  .nbtn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--card);border:1px solid var(--line)}
  .nbtn.solid{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;box-shadow:0 14px 30px rgba(14,75,54,.3)}

  /* ── Scroll аймағы ── */
  .scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 4px 30px 0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(14,75,54,.22);border-radius:99px}
  html[data-theme=dark] .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}

  /* ── Мекеме карточкалары (үлкен, 2 баған) ── */
  .org-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .org-card{position:relative;overflow:hidden;text-align:left;border-radius:26px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--card);
    padding:26px 66px 26px 26px;display:flex;align-items:center;gap:20px;
    transition:transform .22s var(--e),box-shadow .22s var(--e)}
  .org-card:active{transform:scale(.98)}
  .org-logo{width:72px;height:72px;border-radius:20px;flex:none;display:grid;place-items:center;
    background:var(--mint);color:var(--green-l);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  html[data-theme=dark] .org-logo{color:var(--green-l)}
  .org-logo img{width:100%;height:100%;object-fit:contain}
  .org-logo svg{width:34px;height:34px}
  .org-body{min-width:0;flex:1}
  .org-name{font-size:18px;font-weight:600;line-height:1.28;margin-bottom:10px}
  .org-lead{display:flex;align-items:center;gap:10px}
  .lead-photo{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;background:var(--mint);
    display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
  .lead-photo img{width:100%;height:100%;object-fit:cover}
  .lead-photo svg{width:18px;height:18px;color:var(--muted);opacity:.6}
  .lead-tx{min-width:0}
  .lead-name{font-size:13.5px;font-weight:500;line-height:1.25}
  .lead-name.ph{color:var(--muted);font-style:italic;font-weight:400}
  .lead-pos{font-size:11.5px;color:var(--green-l);letter-spacing:.02em}
  html[data-theme=dark] .lead-pos{color:var(--green-l)}
  .org-go{position:absolute;right:20px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;background:var(--mint);color:var(--green)}
  html[data-theme=dark] .org-go{color:var(--green-l)}
  .org-go svg{width:17px;height:17px}

  /* ── Detail Side Panel ── */
  #screen>.panel-overlay{position:absolute}
  .panel-overlay{inset:0;z-index:200;background:rgba(3,10,7,.55);
    opacity:0;pointer-events:none;transition:opacity .3s var(--e)}
  .panel-overlay.show{opacity:1;pointer-events:auto}
  .side-panel{position:absolute;top:0;right:0;bottom:0;width:640px;max-width:92%;
    background:var(--surface);box-shadow:-30px 0 80px rgba(9,42,30,.28);
    transform:translateX(100%);transition:transform .4s var(--e);
    display:flex;flex-direction:column;overflow:hidden}
  .panel-overlay.show .side-panel{transform:translateX(0)}
  .panel-hero{flex:none;padding:34px 34px 26px;background:linear-gradient(150deg,#0b3d2c,#0e4b36 60%,#146447);color:#fff;position:relative}
  .panel-close{position:absolute;top:22px;right:22px;width:42px;height:42px;border-radius:14px;
    background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
  .panel-close svg{width:18px;height:18px}
  .panel-logo{width:76px;height:76px;border-radius:20px;background:rgba(255,255,255,.14);display:grid;place-items:center;margin-bottom:16px;overflow:hidden}
  .panel-logo img{width:100%;height:100%;object-fit:contain}
  .panel-logo svg{width:36px;height:36px;color:#e8cf8f}
  .panel-name{font-size:25px;line-height:1.25;padding-right:50px}

  .panel-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 34px 34px}
  .panel-body::-webkit-scrollbar{width:7px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(14,75,54,.2);border-radius:99px}

  .p-sec{margin-bottom:26px}
  .p-sec-lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}

  .p-lead{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--mint)}
  .p-lead-photo{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;background:var(--surface);
    display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
  .p-lead-photo img{width:100%;height:100%;object-fit:cover}
  .p-lead-photo svg{width:28px;height:28px;color:var(--muted);opacity:.6}
  .p-lead-name{font-size:16px;font-weight:600;margin-bottom:3px}
  .p-lead-name.ph{color:var(--muted);font-style:italic;font-weight:400;font-size:14.5px}
  .p-lead-pos{font-size:13px;color:var(--muted)}

  .p-desc{font-size:14.5px;line-height:1.6;color:var(--ink)}
  .p-desc.ph{color:var(--muted);font-style:italic}

  .p-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .p-row:first-child{border-top:0}
  .p-row-ic{width:38px;height:38px;flex:none;border-radius:12px;background:var(--mint);color:var(--green-l);
    display:grid;place-items:center}
  html[data-theme=dark] .p-row-ic{color:var(--green-l)}
  .p-row-ic svg{width:18px;height:18px}
  .p-row-lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .p-row-val{font-size:14.5px;font-weight:500}
  .p-row-val.ph{color:var(--muted);font-style:italic;font-weight:400}

  .p-actions{display:flex;gap:12px;margin-top:6px}
  .p-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;
    font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
  .p-btn svg{width:17px;height:17px}
  .p-btn.primary{background:linear-gradient(140deg,var(--green-l),var(--green) 65%,var(--green-d));color:#fff;box-shadow:0 14px 30px rgba(14,75,54,.28)}
  .p-btn.ghost{background:var(--mint);color:var(--ink)}
</style>
</head>
<body>
<div id="stage"><div id="screen">

  <header class="top anim" style="animation-delay:.05s">
    <div class="headleft">
      <div class="crest"><img src="./assets/logo-qmdb.png" alt="ҚМДБ"></div>
      <div style="min-width:0">
        <div class="kicker">Қазақстан мұсылмандары діни басқармасы</div>
        <h1 class="pagetitle">ҚМДБ-ҒА ҚАРАСТЫ МЕКЕМЕЛЕР</h1>
      </div>
    </div>
    <div class="navbtns">
      <a class="nbtn ghost" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Артқа
      </a>
      <a class="nbtn solid" href="./index.html" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>
        Басты бет
      </a>
    </div>
  </header>

  <div class="scroll anim" style="animation-delay:.1s">
    <div class="org-grid" id="orgGrid"></div>
  </div>

  <div class="panel-overlay" id="panelOverlay">
    <div class="side-panel" role="dialog" aria-modal="true">
      <div class="panel-hero">
        <button class="panel-close" id="panelClose" aria-label="Жабу">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="panel-logo" id="pLogo"></div>
        <h2 class="panel-name" id="pName"></h2>
      </div>
      <div class="panel-body">

        <div class="p-sec">
          <div class="p-sec-lab">Басшысы</div>
          <div class="p-lead">
            <div class="p-lead-photo" id="pLeadPhoto"></div>
            <div>
              <div id="pLeadName"></div>
              <div class="p-lead-pos" id="pLeadPos"></div>
            </div>
          </div>
        </div>

        <div class="p-sec">
          <div class="p-sec-lab">Мекеме туралы</div>
          <div id="pDesc"></div>
        </div>

        <div class="p-sec">
          <div class="p-sec-lab">Байланыс</div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.2a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2Z"/></svg></div>
            <div><div class="p-row-lab">Телефон</div><div class="p-row-val" id="pPhone"></div></div>
          </div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="m3 6.5 9 6 9-6"/></svg></div>
            <div><div class="p-row-lab">E-mail</div><div class="p-row-val" id="pEmail"></div></div>
          </div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
            <div><div class="p-row-lab">Ресми сайт</div><div class="p-row-val" id="pWeb"></div></div>
          </div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="16.8" cy="7.2" r="1"/></svg></div>
            <div><div class="p-row-lab">Әлеуметтік желі</div><div class="p-row-val" id="pSocial"></div></div>
          </div>
        </div>

        <div class="p-sec">
          <div class="p-sec-lab">Орналасқан жері</div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
            <div><div class="p-row-lab">Мекенжай</div><div class="p-row-val" id="pAddress"></div></div>
          </div>
          <div class="p-row">
            <div class="p-row-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V11l9-7 9 7v10"/><path d="M9 21v-6h6v6"/></svg></div>
            <div><div class="p-row-lab">Қабат / кеңсе</div><div class="p-row-val" id="pOffice"></div></div>
          </div>
        </div>

        <div class="p-actions">
          <span class="p-btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            Сайтқа өту
          </span>
          <span class="p-btn ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></svg>
            Орналасқан жерін көрсету
          </span>
        </div>

      </div>
    </div>
  </div>

</div></div>

<script>
/* ══ Деректер: кейін нақты дерек осында толтырылады ══ */
const INSTITUTIONS = [
  {
    logo:null,
    name:'«Муфтият» баспасы',
    leaderName:null, leaderPosition:'Баспа басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Иман» журналы',
    leaderName:null, leaderPosition:'Бас редактор', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Мұнара» газеті',
    leaderName:null, leaderPosition:'Бас редактор', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Мұнара TV» телеарнасы',
    leaderName:null, leaderPosition:'Телеарна басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Халал Даму» мекемесі',
    leaderName:null, leaderPosition:'Мекеме басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Зекет және қайырымдылық» қоры',
    leaderName:null, leaderPosition:'Қор басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Уақып» қоры',
    leaderName:null, leaderPosition:'Қор басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Qamqor Sharapat» орталығы',
    leaderName:null, leaderPosition:'Орталық басшысы', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Тауаф» турфирмасы',
    leaderName:null, leaderPosition:'Директор', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  },
  {
    logo:null,
    name:'«Дархан Дала» отандық туризм',
    leaderName:null, leaderPosition:'Директор', leaderImage:null,
    description:null,
    phone:null, email:null, website:null, office:null, floor:null, address:null
  }
];

const bldIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V11l8-6 8 6v10"/><path d="M9 21v-8h6v8"/></svg>`;
const personIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 21c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>`;
const arrowIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

function orgCard(o, i){
  const logo = o.logo ? `<img src="${o.logo}" alt="">` : bldIcon;
  const leadPhoto = o.leaderImage ? `<img src="${o.leaderImage}" alt="">` : personIcon;
  const leadName = o.leaderName
    ? `<div class="lead-name">${o.leaderName}</div>`
    : `<div class="lead-name ph">Басшысы жарияланады</div>`;
  return `
    <button class="org-card" data-i="${i}">
      <div class="org-logo">${logo}</div>
      <div class="org-body">
        <div class="org-name">${o.name}</div>
        <div class="org-lead">
          <div class="lead-photo">${leadPhoto}</div>
          <div class="lead-tx">
            ${leadName}
            <div class="lead-pos">${o.leaderPosition || ''}</div>
          </div>
        </div>
      </div>
      <span class="org-go">${arrowIcon}</span>
    </button>`;
}

document.getElementById('orgGrid').innerHTML = INSTITUTIONS.map(orgCard).join('');

const overlay = document.getElementById('panelOverlay');
const val = (v, ph) => v ? `<span class="p-row-val">${v}</span>` : `<span class="p-row-val ph">${ph}</span>`;

function openPanel(o){
  document.getElementById('pLogo').innerHTML = o.logo ? `<img src="${o.logo}" alt="">` : bldIcon;
  document.getElementById('pName').textContent = o.name;

  document.getElementById('pLeadPhoto').innerHTML = o.leaderImage ? `<img src="${o.leaderImage}" alt="">` : personIcon;
  document.getElementById('pLeadName').innerHTML = o.leaderName
    ? `<div class="p-lead-name">${o.leaderName}</div>`
    : `<div class="p-lead-name ph">Басшысы жарияланады</div>`;
  document.getElementById('pLeadPos').textContent = o.leaderPosition || '';

  const desc = document.getElementById('pDesc');
  if (o.description){ desc.className = 'p-desc'; desc.textContent = o.description; }
  else { desc.className = 'p-desc ph'; desc.textContent = 'Мекеме туралы ақпарат жарияланады'; }

  document.getElementById('pPhone').outerHTML = `<div class="p-row-val${o.phone?'':' ph'}" id="pPhone">${o.phone || 'Жарияланады'}</div>`;
  document.getElementById('pEmail').outerHTML = `<div class="p-row-val${o.email?'':' ph'}" id="pEmail">${o.email || 'Жарияланады'}</div>`;
  document.getElementById('pWeb').outerHTML = `<div class="p-row-val${o.website?'':' ph'}" id="pWeb">${o.website || 'Жарияланады'}</div>`;
  document.getElementById('pSocial').outerHTML = `<div class="p-row-val ph" id="pSocial">Жарияланады</div>`;
  document.getElementById('pAddress').outerHTML = `<div class="p-row-val${o.address?'':' ph'}" id="pAddress">${o.address || 'Жарияланады'}</div>`;
  const officeVal = [o.floor, o.office].filter(Boolean).join(', ');
  document.getElementById('pOffice').outerHTML = `<div class="p-row-val${officeVal?'':' ph'}" id="pOffice">${officeVal || 'Жарияланады'}</div>`;

  overlay.classList.add('show');
}
function closePanel(){ overlay.classList.remove('show'); }

document.getElementById('orgGrid').addEventListener('click', e => {
  const card = e.target.closest('.org-card');
  if (card) openPanel(INSTITUTIONS[+card.dataset.i]);
});
document.getElementById('panelClose').addEventListener('click', closePanel);
overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById('screen').style.transform = 'translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize', fit); fit();
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].includes(e.key))e.preventDefault()});
addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));
</script>
</body>
</html>
